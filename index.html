<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FundHub - Gerência de Ensino Fundamental</title>
  <meta name="description" content="Hub de aplicações gerenciais da Gerência de Ensino Fundamental - SME Ribeirão Preto." />
  <!-- O #1d4ed8 aqui é a única cor literal aceitável do projeto: um data:
       URI de favicon não é src/modules/** e não tem como referenciar um
       token CSS de tokens.css. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/%3E%3Cpolyline points='9 22 9 12 15 12 15 22'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <!-- supabase-js (UMD): fonte de dados do FundHub (RLS). Nenhum dado real versionado. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header class="topbar anon">
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu"
            aria-expanded="false" aria-controls="sidebar"></button>

    <a class="brand" href="#/">
      <!-- Marca inline (e não via icones.js) para o logotipo aparecer na tela
           de login, antes de qualquer JS rodar. Se o traçado de `escola` mudar
           em shared/ui/icones.js, mude aqui também. -->
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Fund<span class="hub">Hub</span></strong>
        <small>Ferramentas do Ensino Fundamental · SME Ribeirão Preto</small>
      </span>
    </a>

    <!-- Sino (serviço de notificações) e menu de usuário são inseridos aqui. -->
    <div class="topbar-right"></div>
  </header>

  <!-- Menu lateral: montado por shell/chrome.js a partir do registro de
       módulos, agrupado por seção e filtrado pelas permissões. -->
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Navegação principal"></nav>
    <div class="sidebar-back" id="sidebar-back" hidden></div>

    <div class="conteudo">
      <main id="app" class="app"><div class="loading">Carregando…</div></main>

      <footer class="footer">
        <span>FundHub · Gerência de Ensino Fundamental · SME Ribeirão Preto</span>
        <span id="build-info"></span>
      </footer>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
