<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FundHub - Gerência de Ensino Fundamental</title>
  <meta name="description" content="Hub de aplicações gerenciais da Gerência de Ensino Fundamental - SME Ribeirão Preto." />
  <!-- O #1d4ed8 aqui é a única cor literal aceitável do projeto: um data:
       URI de favicon não é src/modules/** e não tem como referenciar um
       token CSS de tokens.css. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 12l9-9 9 9'/%3E%3Cpath d='M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9'/%3E%3Cpath d='M10 21v-6h4v6'/%3E%3C/svg%3E" />
  <script>
    // Tema ANTES da primeira pintura, para não piscar (spec 2026-10-03, D10).
    // Espelha resolverTema() em src/core/tema.js: mudou lá, mude aqui.
    (function () {
      var t = null;
      try { t = localStorage.getItem('fundhub:tema'); } catch (e) {}
      if (t !== 'claro' && t !== 'escuro') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      }
      document.documentElement.dataset.tema = t;
    })();
  </script>
  <link rel="stylesheet" href="src/styles/main.css" />
  <!-- supabase-js (UMD): fonte de dados do FundHub (RLS). Nenhum dado real versionado. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <header class="topbar anon">
    <button class="topbar-acao nav-toggle" id="nav-toggle" type="button" aria-label="Menu"
            aria-expanded="false" aria-controls="sidebar"></button>

    <a class="brand" href="#/">
      <!-- Marca inline (e não via icones.js) para o logotipo aparecer na tela
           de login, antes de qualquer JS rodar. Se o traçado de `hub` mudar
           em shared/ui/icones.js, mude aqui também. -->
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12l9-9 9 9"/>
          <path d="M5 10v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9"/>
          <path d="M10 21v-6h4v6"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>Fund<span class="hub">Hub</span></strong>
        <small>Hub de Ferramentas do Ensino Fundamental</small>
      </span>
    </a>

    <!-- Sino (serviço de notificações) e menu de usuário são inseridos aqui. -->
    <div class="topbar-right"></div>
  </header>

  <!-- Menu lateral: montado por shell/chrome.js a partir do registro de
       módulos, agrupado por seção e filtrado pelas permissões. -->
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Navegação principal"></nav>
    <div class="sidebar-back" id="sidebar-back" hidden></div>

    <div class="conteudo">
      <main id="app" class="app"><div class="loading">Carregando…</div></main>

      <footer class="footer">
        <!-- A versão fica DENTRO da identificação, logo após o nome do
             sistema: ali ela se lê como "qual FundHub é este". Antes
             ficava no canto oposto, colada na data de hoje, e parecia
             dizer que a versão tinha entrado em vigor hoje. -->
        <span class="rodape-id">
          FundHub
          <span class="build-wrap" id="build-wrap">
            <button type="button" class="build-info" id="build-info"
                    aria-haspopup="dialog" aria-expanded="false"></button>
            <span class="build-card" id="build-card" hidden></span>
          </span>
          · Gerência de Ensino Fundamental · SME Ribeirão Preto
        </span>
        <span id="hoje-info"></span>
      </footer>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
